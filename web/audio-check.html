<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rev Sweeper Revolved - Web Audio Check</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #151719; color: #eef5f6; }
    main { width: min(34rem, calc(100% - 2rem)); }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { color: #b8c4c7; line-height: 1.55; }
    button { display: block; width: 100%; margin: .75rem 0; padding: .85rem 1rem; border: 1px solid #7fcbd2; background: #20292b; color: #f5ffff; cursor: pointer; }
    button:focus-visible { outline: 2px solid #f2e98a; outline-offset: 2px; }
    pre { min-height: 7rem; padding: 1rem; overflow-wrap: anywhere; white-space: pre-wrap; background: #0d0f10; color: #bde9ed; }
  </style>
</head>
<body>
  <main>
    <h1>Web Audio Check</h1>
    <p>Each button should play a short 440 Hz tone. Please test both.</p>
    <button id="web-audio" type="button">Play with Web Audio</button>
    <button id="media-audio" type="button">Play with HTML Audio</button>
    <pre id="status">Ready.</pre>
  </main>
  <script>
    const status = document.querySelector("#status");
    const report = (lines) => { status.textContent = lines.join("\n"); };

    document.querySelector("#web-audio").addEventListener("click", async () => {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("AudioContext is unavailable.");
        const context = new AudioContextClass();
        await context.resume();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.frequency.value = 440;
        gain.gain.setValueAtTime(0.12, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.45);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.45);
        report([
          "Web Audio: play requested",
          `state: ${context.state}`,
          `sample rate: ${context.sampleRate}`,
          `base latency: ${context.baseLatency ?? "unavailable"}`
        ]);
        oscillator.addEventListener("ended", () => context.close());
      } catch (error) {
        report(["Web Audio: failed", String(error)]);
      }
    });

    document.querySelector("#media-audio").addEventListener("click", async () => {
      try {
        const sampleRate = 44100;
        const duration = 0.45;
        const samples = Math.floor(sampleRate * duration);
        const buffer = new ArrayBuffer(44 + samples * 2);
        const view = new DataView(buffer);
        const writeText = (offset, text) => [...text].forEach((char, index) => view.setUint8(offset + index, char.charCodeAt(0)));
        writeText(0, "RIFF");
        view.setUint32(4, 36 + samples * 2, true);
        writeText(8, "WAVEfmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeText(36, "data");
        view.setUint32(40, samples * 2, true);
        for (let index = 0; index < samples; index += 1) {
          const envelope = 1 - index / samples;
          const value = Math.sin(index * Math.PI * 2 * 440 / sampleRate) * envelope * 0.16;
          view.setInt16(44 + index * 2, value * 32767, true);
        }
        const url = URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
        const audio = new Audio(url);
        await audio.play();
        report(["HTML Audio: play requested", `paused: ${audio.paused}`, `volume: ${audio.volume}`]);
        audio.addEventListener("ended", () => URL.revokeObjectURL(url));
      } catch (error) {
        report(["HTML Audio: failed", String(error)]);
      }
    });
  </script>
</body>
</html>
